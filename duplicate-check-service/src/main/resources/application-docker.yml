# في ملف duplicate/resources/application-docker.yml
server:
  port: 8081
  servlet:
    context-path: /

spring:
  datasource:
    url: jdbc:mysql://duplicate-check-mysql:3306/duplicate_check_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: appuser
    password: apppassword
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
  
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# ========== DUPLICATE CHECK CONFIGURATION ==========
duplicate:
  check:
    threshold: ${DUPLICATE_CHECK_THRESHOLD:0.8}
    enable-ai-check: ${DUPLICATE_ENABLE_AI_CHECK:true}
    amount-tolerance: ${DUPLICATE_AMOUNT_TOLERANCE:0.01}
    date-tolerance-days: ${DUPLICATE_DATE_TOLERANCE_DAYS:7}

# ========== GEMINI AI ==========
gemini:
  api:
    key: ${GEMINI_API_KEY}
    url: https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent

# ========== LOGGING ==========
logging:
  level:
    com.example.duplicate_check_service: DEBUG
    org.springframework.web: INFO
  file:
    name: /app/logs/duplicate-check.log
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# ========== ACTUATOR ==========
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always